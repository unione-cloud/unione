#============================================
#
# Spring config
#
#============================================
spring:
   #============================================
   #
   # Data Source config
   #
   #============================================
   datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://8.134.11.253:2206/unione?serverTimezone=Asia/Shanghai&autoReconnect=true&useUnicode=true&characterEncoding=utf8
      username: unione
      password: unione123@Admin


   #============================================
   #
   # Data Pool Druid Config
   #
   #============================================
      druid:
         initial-size: 2
         max-active: 20
         min-idle: 2
         max-wait: 60000
         pool-prepared-statements: true
         validation-query: select 'x'
         test-on-borrow: false
         test-on-return: false
         test-while-idle: true
         
         web-stat-filter:
            enabled: true
            url-pattern: /druid
         stat-view-servlet:
            login-username: unione
            login-password: unione@druid


   #============================================
   #
   # Redis Config
   #
   #============================================
   redis:
      database: 0
      host: 8.134.11.253
      port: 2379
      password: redis@jeking


   #============================================
   #
   # Spring Multipart Config
   #
   #============================================
   servlet:
      multipart:
         max-file-size: 100MB
         max-request-size: 1024MB



#============================================
#
# jetcache Config
#
#============================================
jetcache:
   statIntervalMinutes: 15
   areaInCacheName: false
   local:
      default:
         type: linkedhashmap
         keyConvertor: fastjson
         limit: 1000
         expireAfterWriteInMillis: 600000
         expireAfterAccessInMillis: 300000
   remote:
      default:
         type: redis
         keyConvertor: fastjson
         valueEncoder: java
         valueDecoder: java
         poolConfig:
            minIdle: 5
            maxIdle: 20
            maxTotal: 50
         host: ${spring.redis.host}
         port: ${spring.redis.port}
         password: ${spring.redis.password}

      
#============================================
#
# Logging Config
#
#============================================      
logging:
   level:
      ROOT: INFO


#============================================
#
# security Config
#
#============================================ 
security:
   captcha:
      enable: false


