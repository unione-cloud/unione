#============================================
#
# server config
#
#============================================
server:
  port: 8080
  servlet:
    context-path: /portal
  tomcat:
    uri-encoding: UTF-8

spring:
  main:
    allow-circular-references: true
  application:
    name: unione-portal
  profiles:
    active: pro
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration

  #============================================
  #
  # nacos config
  #
  #============================================
  cloud:
    nacos:
      config:
        enabled: false
        server-addr: 8.134.11.253:8850
        file-extension: yaml
        shared-dataids: unione-global-config.yaml
        refreshable-dataids: unione-global-config.yaml
      discovery:
        enabled: false
        server-addr: ${spring.cloud.nacos.config.server-addr}

  #============================================
  #
  # jackson Config
  #
  #============================================
  jackson:
    default-property-inclusion: NON_NULL
    serialization-inclusion: NON_EMPTY
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
            
            
#============================================
#
# BeetlSql Config
#
#============================================
beetlsql:
  sqlManagers: sqlManager1
  sqlManager1:
    ds: dataSource
    basePackage: com.unione.cloud.**.dao
    daoSuffix: Dao



#============================================
#
#SECURITY config
#
#============================================
security:
  enabled: true
  filter:
    includes: /**
    executions: /portal/,/portal/error,/portal/api/security/login,/portal/api/security/captcha,/portal/api/security/register,/portal/api/common/visit/entry,/portal/v3/api-docs/**,/portal/doc.html/**,/portal/druid/**,/portal/api/system/contactUs/save,/portal/api/system/trendRss/save,/portal/api/system/changeLog/find,/portal/api/system/appInfo/query
  tcm:
    autoEnable: true
  jwt:
    expires: 360000


#============================================
#
#knife4j config
#
#============================================
springdoc:
  swagger-ui:
    tags-sorter: alpha
  group-configs:
    - group: base
      display-name: 基础接口
      paths-to-match: /api/base/**
    - group: common
      display-name: 通用接口
      paths-to-match: /api/common/**  
    - group: security
      display-name: 认证接口
      paths-to-match: /api/security/**
    - group: portal
      display-name: 门户接口
      paths-to-match: /api/portal/**,/api/ucenter/**
    - group: ums
      display-name: 统一消息
      paths-to-match: /api/ums/**    
    - group: system
      display-name: 系统管理
      paths-to-match: /api/system/**
    - group: formData
      display-name: 表单数据
      paths-to-match: /api/data/**
    - group: formPage
      display-name: 表单页面
      paths-to-match: /api/page/**
    - group: ai
      display-name: AI接口
      paths-to-match: /api/ai/**
  default-flat-param-object: true
knife4j:
  enable: true
#  production: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
  basic:
    enable: true
    username: admin
    password: 123456
            