#============================================
#
# server config
#
#============================================
server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  main:
    allow-circular-references: true
    web-application-type: reactive
  application:
    name: unione-gateway
  profiles:
    active: pro

  #============================================
  #
  # nacos config
  #
  #============================================
  cloud:
    nacos:
      config:
        enabled: false
        file-extension: yaml
        namespace: unione-space
        shared-dataids: unione-global-config.yaml
        refreshable-dataids: unione-global-config.yaml
      discovery:
        enabled: ${spring.cloud.nacos.config.enabled}
        namespace: ${spring.cloud.nacos.config.namespace}
        server-addr: ${spring.cloud.nacos.config.server-addr}

  #============================================
  #
  # jackson Config
  #
  #============================================
  jackson:
    default-property-inclusion: NON_NULL
    serialization-inclusion: NON_EMPTY
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
