#============================================
#
# server config
#
#============================================
server:
  port: 8080
  servlet:
    context-path: /job
  tomcat:
    uri-encoding: UTF-8

spring:
  main:
    allow-circular-references: true
  application:
    name: unione-job
  profiles:
    active: pro

  #============================================
  #
  # nacos config
  #
  #============================================
  config:
    import:
      - nacos:unione-job.yaml
      - nacos:unione-global-config.yaml
  cloud:
    nacos:
      config:
        enabled: false
        file-extension: yaml
        namespace: unione-space
      discovery:
        enabled: ${spring.cloud.nacos.config.enabled}
        namespace: ${spring.cloud.nacos.config.namespace}
        server-addr: ${spring.cloud.nacos.config.server-addr}

  ### resources
  mvc:
    servlet:
      load-on-startup: 0
    static-path-pattern: /static/**
  web:
    resources:
      static-locations: classpath:/static/

  ### freemarker
  freemarker:
    templateLoaderPath: classpath:/templates/
    suffix: .ftl
    charset: UTF-8
    requestContextAttribute: request
    settings:
      number_format: 0.##########
      new_builtin_class_resolver: safer


  #============================================
  #
  # jackson Config
  #
  #============================================
  jackson:
    default-property-inclusion: NON_NULL
    serialization-inclusion: NON_EMPTY
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  #============================================
  #
  # Actuator Config
  #
  #============================================
  management:
    metrics:
      export:
        enabled: false
    endpoint:
      metrics:
        enabled: false
    endpoints:
      web:
        exposure:
          include: health,info
            
### mybatis
mybatis:
  mapper-locations: classpath:/mapper/*Mapper.xml

#============================================
#
#SECURITY config
#
#============================================
security:
  enabled: true
  filter:
    includes: /**
    executions: /job/,/job/api/**,/job/auth/login,/job/auth/doLogin
  tcm:
    autoEnable: true
  jwt:
    expires: 360000
