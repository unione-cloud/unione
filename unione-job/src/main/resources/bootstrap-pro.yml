#============================================
#
# Spring config
#
#============================================
spring:
   #============================================
   #
   # Data Source config
   #
   #============================================
   datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://127.0.0.1:3306/xxl_job?serverTimezone=Asia/Shanghai&autoReconnect=true&useUnicode=true&characterEncoding=utf8
      username: xxl_job
      password: xxl_job@123


   #============================================
   #
   # Data Pool Druid Config
   #
   #============================================
      druid:
         initial-size: 2
         max-active: 20
         min-idle: 2
         max-wait: 60000
         pool-prepared-statements: true
         validation-query: select 'x'
         test-on-borrow: false
         test-on-return: false
         test-while-idle: true
         
         web-stat-filter:
            enabled: true
            url-pattern: /druid
         stat-view-servlet:
            login-username: unione
            login-password: unione@druid


   data:
   #============================================
   #
   # Redis Config
   #
   #============================================
      redis:
         database: 0
         host: 127.0.0.1
         port: 6379
         password: admin
         timeout: 100s
         pool:
            max-active: 10
            max-wait: -1
            max-idle: 8
   #============================================
   #
   # Spring Multipart Config
   #
   #============================================
   servlet:
      multipart:
         max-file-size: 100MB
         max-request-size: 1024MB

   ### xxl-job, email
   mail:
      host: smtp.qq.com
      port: 25
      username: xxx@qq.com
      from: xxx@qq.com
      password: xxx
      properties:
         mail:
             smtp:
                auth: true
                starttls:
                   enable: true
                   required: true
                socketFactory:
                   class: javax.net.ssl.SSLSocketFactory

### actuator
management:
   endpoints:
      web:
         base-path: /actuator
   health:
      mail:
         enabled: false

#============================================
#
# jetcache Config
#
#============================================
jetcache:
   statIntervalMinutes: 15
   areaInCacheName: false
   local:
      default:
         type: linkedhashmap
         keyConvertor: fastjson2
         limit: 1000
         expireAfterWriteInMillis: 600000
         expireAfterAccessInMillis: 300000
   remote:
      default:
         type: redis
         keyConvertor: fastjson2
         valueEncoder: java
         valueDecoder: java
         poolConfig:
            minIdle: 5
            maxIdle: 20
            maxTotal: 50
         host: ${spring.data.redis.host}
         port: ${spring.data.redis.port}
         password: ${spring.data.redis.password}

### xxl-job, access token
xxl:
   job:
      accessToken: unione-job
      timeout: 3
      ### xxl-job, i18n (default is zh_CN, and you can choose "zh_CN", "zh_TC" and "en")
      i18n: zh_CN
      ### xxl-job, triggerpool max size
      triggerpool:
         fast.max: 200
         slow.max: 100
      ### xxl-job, log retention days
      logretentiondays: 30

### xxl-sso
xxl-sso:
   token:
      key: xxl_job_token
      timeout: 604800000
      
#============================================
#
# Logging Config
#
#============================================      
logging:
   level:
      ROOT: info

