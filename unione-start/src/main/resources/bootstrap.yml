#============================================
#
# server config
#
#============================================
server:
   port: 8080
   servlet:
      context-path: /portal
   tomcat:
      uri-encoding: UTF-8

spring:
   main:
      allow-circular-references: true
   application:
      name: unione-portal
   profiles:
      active: pro

   #============================================
   #
   # nacos config
   #
   #============================================
   cloud:
      nacos:
         config:
            enabled: false
            server-addr: 8.134.11.253:8850
            file-extension: yaml
            shared-dataids: unione-global-config.yaml
            refreshable-dataids: unione-global-config.yaml
         discovery:
            enabled: false
            server-addr: ${spring.cloud.nacos.config.server-addr}

   #============================================
   #
   # jackson Config
   #
   #============================================
   jackson:
      default-property-inclusion: NON_NULL
      serialization-inclusion: NON_EMPTY
            
            
#============================================
#
# BeetlSql Config
#
#============================================
beetlsql:
  sqlManagers: sqlManager
  sqlManager:
    ds: dataSource
    basePackage: com.unione.cloud.**.dao
    daoSuffix: Dao




#============================================
#
#SECURITY config
#
#============================================
security:
   enabled: true
   filter:
      includes: /**
      executions: /portal/,/portal/api/security/login,/portal/api/security/captcha,/portal/api/security/register,/portal/api/security/secret/encrypt,/portal/api/security/secret/pubkey,/portal/swagger-ui.html/**,/portal/webjars/**,/portal/swagger-resources/**,/portal/v2/api-docs,/portal/doc.html/**,/portal/druid/**




            