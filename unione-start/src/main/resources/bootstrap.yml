#============================================
#
# server config
#
#============================================
server:
  port: 8080
  servlet:
    context-path: /portal
  tomcat:
    uri-encoding: UTF-8

spring:
  main:
    allow-circular-references: true
  application:
    name: unione-portal
  profiles:
    active: pro

  #============================================
  #
  # nacos config
  #
  #============================================
  cloud:
    nacos:
      config:
        enabled: false
        server-addr: 8.134.11.253:8850
        file-extension: yaml
        shared-dataids: unione-global-config.yaml
        refreshable-dataids: unione-global-config.yaml
      discovery:
        enabled: false
        server-addr: ${spring.cloud.nacos.config.server-addr}

  #============================================
  #
  # jackson Config
  #
  #============================================
  jackson:
    default-property-inclusion: NON_NULL
    serialization-inclusion: NON_EMPTY
            
            
#============================================
#
# BeetlSql Config
#
#============================================
beetlsql:
  sqlManagers: sqlManager
  sqlManager:
    ds: dataSource
    basePackage: com.unione.cloud.**.dao
    daoSuffix: Dao




#============================================
#
#SECURITY config
#
#============================================
security:
  enabled: true
  filter:
    includes: /**
    executions: /portal/,/portal/error,/portal/api/security/login,/portal/api/security/captcha,/portal/api/security/register,/portal/v3/api-docs/**,/portal/doc.html/**,/portal/druid/**
  tcm:
    autoEnable: true
  jwt:
    expires: 360000


#============================================
#
#knife4j config
#
#============================================
springdoc:
  swagger-ui:
    tags-sorter: alpha
  group-configs:
    - group: common
      display-name: 通用接口
      packages-to-scan: com.unione.cloud.portal.common.api
    - group: security
      display-name: 认证接口
      paths-to-match: /api/security/**
    - group: portal
      display-name: 门户接口
      paths-to-match: /api/portal/**      
    - group: system
      display-name: 系统管理
      paths-to-match: /api/system/**
    - group: formData
      display-name: 表单数据
      paths-to-match: /api/data/**
    - group: formPage
      display-name: 表单页面
      paths-to-match: /api/page/**
  default-flat-param-object: true
knife4j:
  enable: true
#  production: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
  basic:
    enable: true
    username: admin
    password: 123456
            